services:
  - type: web
    name: vivran-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      # Last-resort failover: used only when Gemini reports itself busy on both
      # the primary and fallback model (never a spent quota or safety refusal).
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Declared (not valued) so the Blueprint is an accurate inventory of what
      # this service actually reads — these were previously set only in the
      # dashboard and invisible from the repo. `sync: false` tells Render to
      # keep whatever is already configured there; it does not blank them.
      # REFERRAL_CODE in particular MUST be set: without it the beta gate
      # refuses every code and no new teacher can get in. Use a long random
      # value; the old six-digit code is public in this repo's history.
      - key: REFERRAL_CODE
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: CARTESIA_API_KEY
        sync: false
      - key: TALLY_API_KEY
        sync: false
