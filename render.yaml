services:
  - type: web
    name: vivran-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      # DORMANT second provider. With this unset — which it is today, and there
      # is no key to test with — nothing in the backend ever reaches Groq and
      # behaviour is identical to before the failover existed. Setting it turns
      # on failover for exactly one case: Gemini reporting itself busy or
      # overloaded (never a spent quota, never a safety refusal). The first
      # real call will also be the first live test of app/ai/groq_client.py.
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Declared (not valued) so the Blueprint is an accurate inventory of what
      # this service actually reads — these were previously set only in the
      # dashboard and invisible from the repo. `sync: false` tells Render to
      # keep whatever is already configured there; it does not blank them.
      # REFERRAL_CODE in particular MUST be set: without it the beta gate falls
      # back to the code committed in app/core/config.py, which is public.
      - key: REFERRAL_CODE
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: CARTESIA_API_KEY
        sync: false
      - key: TALLY_API_KEY
        sync: false
