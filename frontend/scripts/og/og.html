<!doctype html>
<!--
  The link-preview image (public/og-*.png, 1200x630), in the landing page's
  paper-and-ink style. Render it from the frontend folder with any headless
  Chrome at a 1200x630 viewport, e.g. Playwright:
    page.goto("file://.../scripts/og/og.html"); page.screenshot({ path: "public/og-v2.png" })
  Then point og:image in public/home.html at the new file name (chat apps
  cache previews by image URL, so a changed image needs a new name).
  Everything that matters sits in the middle 630px, which is what WhatsApp
  shows when it crops the preview to a square.
-->
<html>
<head>
<meta charset="utf-8" />
<style>
@font-face { font-family: Inter; font-weight: 100 900; src: url(../../public/landing/fonts/inter-latin.dd8a4575.woff2) format("woff2"); }
@font-face { font-family: Deva; font-weight: 100 900; src: url(../../public/landing/fonts/noto-sans-devanagari-devanagari.12223f2b.woff2) format("woff2"); }
:root { --paper: #FBF8F3; --ink: #14100C; --ink-2: #4A443C; --ink-3: #7A7165; --accent: #C6431E; --rule: rgba(20,16,12,.12); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body {
  font-family: Inter, sans-serif; color: var(--ink); background: var(--paper);
  position: relative; -webkit-font-smoothing: antialiased;
}
/* the dot field, still: fine dots, a warm wash, blueprint crosshairs */
.dots, .wash, .marks { position: absolute; inset: 0; }
.wash { background: radial-gradient(ellipse 46% 60% at 50% 48%, rgba(198,67,30,.10), transparent 72%); }
.dots {
  background-image: radial-gradient(circle at center, rgba(20,16,12,.30) 1.15px, transparent 1.7px);
  background-size: 24px 24px; background-position: 12px 3px;
  -webkit-mask-image: radial-gradient(ellipse 75% 85% at 50% 50%, transparent 30%, #000 62%, #000 80%, transparent 100%);
}
.marks {
  background-image:
    linear-gradient(rgba(20,16,12,.28), rgba(20,16,12,.28)), linear-gradient(rgba(20,16,12,.28), rgba(20,16,12,.28));
  background-size: 10px 1px, 1px 10px; background-repeat: no-repeat;
}
.mark { position: absolute; width: 11px; height: 11px; }
.mark::before, .mark::after { content: ""; position: absolute; background: rgba(20,16,12,.32); }
.mark::before { left: 0; right: 0; top: 5px; height: 1px; }
.mark::after { top: 0; bottom: 0; left: 5px; width: 1px; }

.stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.brand { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; }
.brand img { width: 58px; height: 58px; }
.brand b { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; }
.brand span { font-family: Deva, sans-serif; font-size: 22px; color: var(--ink-3); font-weight: 500; margin-left: 2px; }
h1 { font-size: 64px; line-height: 1.04; font-weight: 700; letter-spacing: -0.045em; max-width: 960px; }
h1 em { font-style: normal; color: var(--ink-3); }
.sub { margin-top: 22px; font-size: 25px; line-height: 1.4; color: var(--ink-2); letter-spacing: -0.01em; }
.sub strong { color: var(--ink); font-weight: 600; }
.row { margin-top: 34px; display: flex; gap: 10px; align-items: center; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px;
  border: 1px solid var(--rule); border-radius: 999px; background: #fff;
  font-size: 18px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em;
  box-shadow: 0 1px 2px rgba(20,16,12,.05), 0 8px 20px -14px rgba(20,16,12,.3);
}
.cite { font-size: 15px; font-weight: 600; letter-spacing: .02em; color: var(--accent); background: rgba(198,67,30,.09); border: 1px solid rgba(198,67,30,.28); }
.url { position: absolute; bottom: 30px; left: 0; right: 0; text-align: center; font-size: 17px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
</style>
</head>
<body>
  <div class="wash"></div>
  <div class="dots"></div>
  <i class="mark" style="left:84px;top:66px"></i><i class="mark" style="right:84px;top:66px"></i>
  <i class="mark" style="left:84px;bottom:66px"></i><i class="mark" style="right:84px;bottom:66px"></i>
  <i class="mark" style="left:228px;top:306px"></i><i class="mark" style="right:228px;top:306px"></i>

  <main class="stage">
    <div class="brand"><img src="../../app/icon.svg" alt="" /><b>Vivran</b><span>विवरण</span></div>
    <h1>Your chapter in.<br /><em>Your week&rsquo;s teaching out.</em></h1>
    <p class="sub">Plans, slides, worksheets and papers that cite your pages. <strong>Free for teachers.</strong></p>
    <div class="row">
      <span class="chip">Course plan</span>
      <span class="chip">Slides</span>
      <span class="chip">Worksheet</span>
      <span class="chip">Exam paper</span>
      <span class="chip cite">Unit 5.pdf · p.23</span>
    </div>
  </main>
  <div class="url">vivran.co.in</div>
</body>
</html>
